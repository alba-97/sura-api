services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: surabank
      POSTGRES_USER: surabank
      POSTGRES_PASSWORD: surabank123
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U surabank']
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build: .
    ports:
      - '8000:8000'
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: surabank
      DB_USER: surabank
      DB_PASS: surabank123
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
